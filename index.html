<style>

.docu{border:1px solid var(--fg);padding:18px;display:flex;flex-direction:column;gap:12px;text-align:center}

.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 200px}
/* Encuesta */
form.uni{display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);padding-top:18px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
legend,label.q{font-weight:600;font-size:16px;margin-bottom:8px;padding:0}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills input{position:absolute;opacity:0;pointer-events:none}
.pills label{border:1px solid var(--line);padding:9px 12px;font-size:14px;cursor:pointer;min-height:40px;display:flex;align-items:center}
.pills input:checked+label{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.pills input:focus-visible+label{outline:3px solid var(--red);outline-offset:2px}
textarea{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:12px;font:inherit;font-size:16px;resize:vertical}

footer{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;padding-top:8px}

<script>
/* =====================================================================
CONFIGURACIÓN — lo único que el equipo necesita editar
===================================================================== */
const CONFIG = {
// Link del documental (YouTube, Vimeo, Drive…). Si se deja vacío, el botón no aparece.
documentalURL: "",
// Encuesta opcional en Google Forms (ver README.md). Si se deja en null, la encuesta no aparece.
googleForm: null
};
/* =====================================================================
DATOS — precios Colombia 2026 (ver "Fuentes" al final del juego)
===================================================================== */
const P = {
desarrollo:455000, marcador:150000, regional:200000, hatogrande:500000, championship:555000,
caddie:{pro:300000, eco:200000, solo:0, familia:50000},
psico:150000, clase:80000, fisico:300000, equipo:1800000,
americas:2500000, // inscripción USD 220 + impuestos (≈ COP 900.000) + caddie, hospedaje y transporte de la semana
coachPlan:2500000, coachClases:400000, coachEco:200000
};
const TORNEOS = {
regional:{nombre:"Torneo regional",campo:48,premios:[150000,400000,1000000,2000000]},
desarrollo:{nombre:"Tour de Desarrollo · FEDEGOLF",campo:54,premios:[300000,900000,2500000,5000000]},
hatogrande:{nombre:"8º Abierto Hatogrande",campo:59,premios:[800000,2500000,7000000,13000000]},
championship:{nombre:"Tour Championship Colombia",campo:61,premios:[800000,2500000,7000000,13000000]},
americas:{nombre:"PGA Tour Americas · parada en Colombia",campo:80,premios:[8000000,24000000,60000000,160000000],usd:["≈ USD 2.000","≈ USD 6.000","≈ USD 15.000","USD 40.500"]}
};
const Q = {
carlosEco:{t:"La realidad es que el tema económico es determinante.",w:"Carlos Avendaño · periodista de golf"},
carlosSolo:{t:"A diferencia de los deportes de conjunto, en el golf todos los gastos recaen sobre una sola persona.",w:"Carlos Avendaño · periodista de golf"},
carlosMedios:{t:"Salvo que haya un muy buen resultado, el golf no tiene esos espacios en los medios.",w:"Carlos Avendaño · periodista de golf"},
alejoBog:{t:"Cuando los torneos son en Bogotá, el presupuesto más o menos para un torneo es de un millón y medio: la inscripción y el caddie.",w:"Alejandro Velásquez · golfista profesional"},
alejoCorte:{t:"Vamos a un torneo, nos gastamos tres o cuatro millones y no pasamos el corte. Son tres o cuatro millones que están perdidos.",w:"Alejandro Velásquez · golfista profesional"},
alejoClases:{t:"Son tres o cuatro horas que ya me gasté dando clases para poder tener el sustento para sobrevivir, y otras tres o cuatro para entrenar.",w:"Alejandro Velásquez · golfista profesional"},
alejoLesion:{t:"Me sentía en el mejor momento. Salí convencido de que me iba a ganar el torneo… y en el hoyo ocho me lesioné.",w:"Alejandro Velásquez · golfista profesional"},
alejoMentira:{t:"La plata siempre va a ser una presión, y el que diga que eso no presiona es un mentiroso.",w:"Alejandro Velásquez · golfista profesional"},
alejoDisfrutar:{t:"Si voy a un torneo y no disfruto, no jugaré más. La idea de esto es uno ser feliz y disfrutarlo.",w:"Alejandro Velásquez · golfista profesional"},
gusBolsa:{t:"Las bolsas siguen siendo las mismas de hace 15 años. Tengo que salir tercero o ganar para recuperar.",w:"Gustavo Mendoza · 69 torneos ganados en Colombia"},
gusPresion:{t:"La presión es mayor cuando usted tiene que jugar bien para poder pagar las cosas de su casa.",w:"Gustavo Mendoza · 69 torneos ganados en Colombia"},
gusPatrocinio:{t:"A no ser que sea uno muy amigo del dueño de la empresa o algo así, le dan algo de dinero.",w:"Gustavo Mendoza · 69 torneos ganados en Colombia"},
gusEquipo:{t:"Lo más importante es tener un buen entrenador, una buena preparación física, una persona que lo ayude mentalmente… y una cuenta grande, porque eso vale mucho.",w:"Gustavo Mendoza · 69 torneos ganados en Colombia"},
gusUSA:{t:"Usted no puede irse a Estados Unidos, jugar un torneo y, si no pasa algo, devolverse. Por eso no logramos, aunque teníamos el nivel.",w:"Gustavo Mendoza · 69 torneos ganados en Colombia"},
gusApoyo:{t:"Hay personas que juegan muy bien, pero no tienen el apoyo. Sin eso, en la mitad todos se devuelven.",w:"Gustavo Mendoza · 69 torneos ganados en Colombia"}
};
/* =====================================================================
ESTADO Y UTILIDADES
===================================================================== */
let s, step, phase, view, prev={};
const $=id=>document.getElementById(id);
const cop=n=>(n<0?"−":"")+"$"+Math.abs(Math.round(n)).toLocaleString("es-CO");
const clamp=v=>Math.max(0,Math.min(100,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const chance=p=>Math.random()<p;
const LAB={dinero:"Plata",tecnica:"Técnica",fisico:"Físico",mental:"Cabeza",rep:"Reputación",lesion:"Lesión",ranking:"Ranking"};
function apply(d){for(const[k,v]of Object.entries(d||{})){if(!v)continue;if(k==="dinero"||k==="ranking")s[k]+=v;else s[k]=clamp(s[k]+v)} s.ranking=Math.max(1,Math.min(250,s.ranking));}
function chips(d){return Object.entries(d||{}).filter(([,v])=>v).map(([k,v])=>{
const good=(k==="lesion"||k==="ranking")?v<0:v>0;
const txt=k==="dinero"?(v>0?"+":"")+cop(v):k==="ranking"?(v<0?"sube "+(-v)+" puestos":"baja "+v+" puestos"):(v>0?"+":"")+v;
return `<span class="chip ${good?"up":"down"}">${LAB[k]} ${txt}</span>`}).join("")}
const quote=k=>{const q=Q[k];return q?`<figure class="quote"><q>${q.t}</q><cite>${q.w}</cite></figure>`:""};
const STAKES=`<div><div class="stakes">${"<i></i>".repeat(9)}</div><div class="ob"></div></div>`;
function pay(n){s.dinero-=n; s.gastado+=n}
function hud(){
const set=(id,txt)=>{const el=$(id);if(prev[id]!==undefined&&prev[id]!==txt){el.classList.remove("bump");void el.offsetWidth;el.classList.add("bump")}prev[id]=txt;el.textContent=txt};
set("vPlata",cop(s.dinero)); $("vPlata").classList.toggle("low",s.dinero<600000);
[["vTec","fTec","tecnica"],["vFis","fFis","fisico"],["vMen","fMen","mental"],["vRep","fRep","rep"]].forEach(([v,f,k])=>{set(v,Math.round(s[k]));$(v).classList.toggle("low",s[k]<25);$(f).style.width=s[k]+"%";$(f).classList.toggle("low",s[k]<25)});
$("status").innerHTML=`<span>Ranking nacional <b>#${s.ranking}</b></span>${s.lesion>0?`<span class="${s.lesion>=40?"bad":""}">Lesión <b>${Math.round(s.lesion)}</b></span>`:""}${s.deuda>0?`<span class="bad">Deuda <b>${cop(s.deuda)}</b></span>`:""}${s.patro?`<span>Patrocinio <b>sí</b></span>`:""}`;
}
/* =====================================================================
TORNEOS
El talento de partida es igual en todas las partidas. El resultado depende de
técnica, cabeza, físico, caddie, lesión y de la presión de necesitar la plata.
===================================================================== */
function jugar(key,mod=0,varianza=0,tope=null){
const T=TORNEOS[key];
let score=s.tecnica*.45+s.mental*.25+s.fisico*.15+5;
const cad={pro:5,eco:2,familia:0,solo:-3,marcador:0}[s.caddieUso]||0;
score+=cad+mod-(s.lesion*.15)+(s.dinero<500000?-6:0)+rnd(-12-varianza,12+varianza);
const d=score-T.campo;
let k=d<-4?0:d<5?1:d<12?2:d<19?3:4;
if(tope!==null) k=Math.min(k,tope);
const NOM=["No pasaste el corte","Pasaste el corte","Top 10","Top 3","¡Ganaste el torneo!"];
const premio=k===0?0:T.premios[k-1];
const fx=[{mental:-10,rep:-2,ranking:12},{mental:2,rep:3,ranking:-6},{mental:4,rep:8,ranking:-15},{mental:7,rep:14,ranking:-28},{mental:10,rep:22,ranking:-45}][k];
if(key==="americas"){fx.rep+=10; fx.ranking=Math.round(fx.ranking*1.3)}
apply(fx); apply({tecnica:2}); s.dinero+=premio; s.premios+=premio; s.torneos.push({key,k});
if(k>0)s.cortes++; else s.fallos++;
if(s.caddieUso==="solo") apply({fisico:-8,lesion:10});
return {T,key,k,txt:NOM[k],premio,fx,cad,usd:T.usd&&k>0?T.usd[k-1]:null,presion:s.dinero-premio<500000};
}
/* =====================================================================
ESCENARIOS
Cada opción: t (título), c (costo/efecto visible), fx (texto corto), cost (para
bloquear si no alcanza), go() → {r: respuesta, d: cambios, eco: aviso de futuro}
===================================================================== */
const SC = {
inicio:{tag:"Inicio de temporada",titulo:"¿Qué torneo juegas primero?",q:"carlosEco",
texto:()=>`Te llega la invitación al <b>Tour de Desarrollo</b> de la Federación Colombiana de Golf: inscripción de ${cop(P.desarrollo)} para nacionales y, como allí no se permite caddie, un marcador obligatorio de ${cop(P.marcador)}. También hay un torneo regional más barato, con menos exposición.`,
opts:[

/* =====================================================================
FLUJO
===================================================================== */
const FLOW=[
{id:"inicio"},
{id:"caddie",when:()=>s.torneoA&&s.torneoA!=="desarrollo"},
{id:"vuelta",when:()=>!!s.torneoA,pre:()=>{s.vueltaEn=s.torneoA;s.caddieUso=s.torneoA==="desarrollo"?"marcador":s.caddie}},
{id:"T",torneo:"A",when:()=>!!s.torneoA},
{id:"presupuesto"},
{id:"semana"},
{id:"caddie",when:()=>!s.caddie||s.caddie==="marcador"},
{id:"vuelta",when:()=>!s.vueltaHecha,pre:()=>{s.vueltaEn="hatogrande";s.caddieUso=s.caddie}},
{id:"T",torneo:"B"},
{id:"dinero"},
{id:"T",torneo:"C",when:()=>s.juegaC},
{id:"lesion"},
{id:"patrocinio"},
{id:"entrenador"},
{id:"presion"},
{id:"internacional"},
{id:"T",torneo:"D",when:()=>s.juegaD},
{id:"final"}
];
function reset(){
s={dinero:3000000,tecnica:50,fisico:70,mental:60,rep:20,lesion:0,ranking:150,deuda:0,
gastado:0,premios:0,ingresos:0,cortes:0,fallos:0,torneos:[],log:[],ecos:[],caddie:null,caddieUso:null,mod:null,
vueltaHecha:false,patro:0,fin:null,finCausa:""};
step=-1; prev={}; view={type:"intro"}; render();
}
function checkFin(){
if(s.fin) return s.fin;
if(s.mental<=0){s.fin="quemado";s.finCausa="la presión, las deudas y los malos resultados te vaciaron la cabeza"}
else if(s.fisico<=0||s.lesion>=70){s.fin="lesionado";s.finCausa="la lesión de espalda se volvió crónica y el cuerpo dijo basta"}
return s.fin;
}
function advance(){
if(checkFin()&&!["intl","local","profe","contenido","pausa"].includes(s.fin)){view={type:"fin"};return render()}
while(++step<FLOW.length){
const f=FLOW[step];
if(f.when&&!f.when())continue;
if(f.pre)f.pre();
if(f.id==="T"){view={type:"torneo",res:jugarEtapa(f.torneo)};return render()}
view={type:"esc",id:f.id};return render();
}
view={type:"fin"};render();
}
function jugarEtapa(etapa){
const mod=s.mod||{m:0,v:0}; let key, cobro=0, nota="";
if(etapa==="A"){key=s.torneoA}
if(etapa==="B"){key="hatogrande"; s.caddieUso=s.caddie;
cobro=P.hatogrande+(P.caddie[s.caddie]||0);
if(s.dinero<cobro){return {skip:true,nombre:TORNEOS.hatogrande.nombre,txt:`No te alcanzó para inscribirte: necesitabas ${cop(cobro)} y tenías ${cop(s.dinero)}.`,d:{mental:-8,rep:-3,ranking:8}}}
pay(cobro); nota=`Inscripción ${cop(P.hatogrande)} + caddie ${cop(P.caddie[s.caddie]||0)}`;
if(s.sinRitmo){mod.m-=5;nota+=" · Sin ritmo de competencia: el mes que no jugaste se nota."; s.sinRitmo=false}}
if(etapa==="C"){key="championship"; s.caddieUso=s.caddie; cobro=P.championship+(P.caddie[s.caddie]||0);
if(s.dinero<cobro){s.deuda+=cobro-s.dinero;s.dinero=cobro} pay(cobro); nota=`Inscripción ${cop(P.championship)} + caddie ${cop(P.caddie[s.caddie]||0)}`}
if(etapa==="D"){key="americas"; s.caddieUso="pro"; nota=s.patroD?"Tu patrocinador cubrió la semana.":`Te costó ${cop(P.americas)}`; s.gastadoD=s.patroD?0:P.americas}
const usarVuelta=s.vueltaEn===key&&!s.vueltaHecha;
const r=jugar(key,usarVuelta?mod.m:0,usarVuelta?mod.v:0,usarVuelta&&mod.tope!==undefined?mod.tope:null);
if(usarVuelta){s.vueltaHecha=true;s.mod=null}
if(etapa==="A") r.costo=key==="desarrollo"?P.desarrollo+P.marcador:P.regional+(P.caddie[s.caddie]||0);
else if(etapa==="D") r.costo=s.gastadoD;
else r.costo=cobro;
if(etapa==="A"&&key!=="desarrollo"&&s.caddie){pay(P.caddie[s.caddie]||0)}
r.nota=nota; return r;
}
function choose(idx){
const sc=SC[view.id], o=sc.opts[idx];
document.querySelectorAll(".opt").forEach(b=>b.classList.add("dis"));
const out=o.go(); apply(out.d&&Object.fromEntries(Object.entries(out.d).filter(([k])=>k!=="dinero")));
if(out.eco)s.ecos.push(out.eco);
s.log.push({tag:sc.tag,t:o.t});
if(out.fin){s.fin=out.fin;view={type:"fin"};return render()}
view={type:"res",sc:view.id,o,out};render();
}
/* =====================================================================
PANTALLAS
===================================================================== */
function render(){
hud();
const el=$("screen"); el.style.animation="none"; void el.offsetWidth; el.style.animation="";
window.scrollTo(0,0);
const V=view;
if(V.type==="intro"){
$("month").textContent="Temporada 2026";
el.innerHTML=`<p class="kicker">El costo del green</p>
<h1>Tienes talento.<br>¿Te alcanza?</h1>${STAKES}
<p class="lead">Eres un golfista colombiano de 24 años, con talento y sin patrocinio. Tienes <b>${cop(3000000)}</b> para toda la temporada y hasta doce decisiones por delante.</p>
<p class="hook">Ninguna decisión es buena o mala por sí sola: pagar un caddie puede salvar un torneo o hundir tus finanzas.</p>
<div class="how"><div><b>Plata</b>Inscripciones, caddie, viajes, entrenamiento.</div><div><b>Cuerpo</b>Técnica, físico y lesiones.</div><div><b>Cabeza</b>Presión, confianza y reputación.</div></div>
<p class="flow">Si la cabeza o el físico llegan a cero, tu carrera se detiene. Los precios son reales de Colombia en 2026.</p>
<button class="btn" id="go">Empezar la temporada</button>
<p class="credits">Basado en los testimonios de Alejandro Velásquez (golfista profesional), Gustavo Mendoza (69 torneos ganados en Colombia) y Carlos Avendaño (periodista de golf), y en precios oficiales de la Federación Colombiana de Golf y PGA Tour Americas para 2026.</p>`;
$("go").onclick=advance; return;
}
if(V.type==="esc"){
const sc=SC[V.id];
$("month").textContent=`Decisión ${s.log.length+1}`;
const val=x=>typeof x==="function"?x():x;
el.innerHTML=`<div class="tag">${sc.tag}</div><h2>${sc.titulo}</h2><p class="lead">${sc.texto()}</p>
<div class="opts" role="group" aria-label="Opciones">${sc.opts.map((o,k)=>{
const cost=val(o.cost)||0; let why=o.req?o.req():null;
if(!why&&cost>s.dinero) why=`No te alcanza: tienes ${cop(s.dinero)}.`;
return `<button class="opt" data-k="${k}" ${why?"disabled":""}><span class="t">${o.t}</span><span class="c">${val(o.c)}</span><span class="fx">${o.fx}</span>${why?`<span class="why">${why}</span>`:""}</button>`}).join("")}</div>`;
el.querySelectorAll(".opt:not([disabled])").forEach(b=>b.onclick=()=>choose(+b.dataset.k));
if(!el.querySelector(".opt:not([disabled])")){ // sin salida: talento sin recursos
s.fin="sinrecursos";s.finCausa="no tuviste con qué pagar la siguiente decisión";
el.insertAdjacentHTML("beforeend",`<button class="btn" id="fin">Ver cómo termina</button>`);$("fin").onclick=()=>{view={type:"fin"};render()};
}
return;
}
if(V.type==="res"){
const sc=SC[V.sc], out=V.out;
el.innerHTML=`<div class="tag">${sc.tag} · tu decisión</div><h2>${V.o.t}</h2><p class="lead">${out.r}</p>
<div class="chips">${chips(out.d)}</div>
${quote(sc.q)}
${out.eco?`<p class="warn">${out.eco}</p>`:""}
<button class="btn" id="next">${(()=>{const e=checkFin();return e&&!["intl","local","profe","contenido","pausa"].includes(e)?"Ver cómo termina":"Continuar"})()}</button>`;
$("next").onclick=advance; return;
}
if(V.type==="torneo"){
const r=V.res;
$("month").textContent="Torneo";
if(r.skip){apply(r.d);hud();
el.innerHTML=`<div class="tag">Torneo · ${r.nombre}</div><div class="result bad">No jugaste</div><p class="lead">${r.txt}</p><div class="chips">${chips(r.d)}</div>${quote("alejoCorte")}<button class="btn" id="next">Continuar</button>`;
$("next").onclick=advance; return;}
const neto=r.premio-r.costo;
el.innerHTML=`<div class="card"><div class="tag">Resultado · ${r.T.nombre}</div>
<div class="result ${r.k===0?"bad":r.k>=2?"good":""}">${r.txt}</div>
<div class="ledger"><span>Lo que te costó jugar</span><span class="n">−${cop(r.costo)}</span><span>Premio${r.usd?` (${r.usd})`:""}</span><span class="n">${r.premio?"+"+cop(r.premio):"$0"}</span><span class="tot">Balance del torneo</span><span class="n tot" style="color:${neto<0?"var(--red)":"var(--green)"}">${neto>0?"+":""}${cop(neto)}</span></div>
${r.nota?`<p class="dice">${r.nota}</p>`:""}
${r.presion?`<p class="muted">Jugaste con la cuenta casi vacía. La presión de necesitar el premio te costó golpes.</p>`:""}
${neto<0&&r.premio>0?`<p class="muted">Pasaste el corte y aun así perdiste plata.</p>`:""}
${s.caddieUso==="solo"?`<p class="muted">Cargaste tu propia bolsa tres días: la espalda lo sintió.</p>`:""}
<div class="chips">${chips(r.fx)}</div></div>
${quote(r.k===0?"alejoCorte":r.k>=3?"carlosMedios":"gusBolsa")}
<button class="btn" id="next">Continuar</button>`;
$("next").onclick=advance; return;
}
if(V.type==="fin") renderFin();
}
const FINALES={
consolidado:["Profesional consolidado","Lo lograste… por ahora.","Conseguiste patrocinio, resultados y estabilidad. Eres la excepción: casi nadie llega aquí sin apoyo."],
superviviente:["Golfista superviviente","Sigues compitiendo.","Juegas, pero dependes de clases, préstamos y trabajos alternos. Cada inscripción es una negociación con tu cuenta."],
sinrecursos:["Talento sin recursos","Tenías nivel. No te alcanzó.","No fue un mal swing: fue una cuenta que no alcanzó para el siguiente paso."],
lesionado:["Lesionado","El cuerpo dijo basta.","Priorizaste competir pese al dolor y perdiste la continuidad."],
quemado:["Quemado mentalmente","Dejaste de disfrutarlo.","Acumulaste presión, deudas y malos resultados hasta que el golf dejó de ser tuyo."],
reinvencion:["Reinvención","Dejaste la alta competencia.","Encontraste una vía sostenible en el golf, lejos de la tarjeta de profesional."],
despegue:["Despegue internacional","Convertiste una oportunidad en carrera.","Clasificaste, conseguiste apoyo y saliste del país con respaldo. Muy pocos lo logran así."]
};
function resolverFinal(){
const f=s.fin, buenD=s.torneos.some(t=>t.key==="americas"&&t.k>=3);
if(["quemado","lesionado","sinrecursos","reinvencion"].includes(f)) return f;
if(f==="intl") return (buenD||(s.rep>=55&&(s.patro||s.dinero>=6000000)))?"despegue":(s.dinero+(s.patro?2000000:0)>=11000000?"superviviente":"sinrecursos");
if(f==="profe"||f==="contenido") return "reinvencion";
if(f==="pausa") return s.deuda>0?"superviviente":"superviviente";
if(f==="local") return (s.rep>=60&&s.patro&&s.dinero>=5000000&&!s.deuda)?"consolidado":"superviviente";
return "superviviente";
}
let current=null;
function renderFin(){
const key=resolverFinal(), F=FINALES[key], el=$("screen");
const invertido=s.gastado, neto=s.premios-invertido;
const n=s.torneos.length;
current={key,frase:`En El Costo del Green terminé como "${F[0]}": jugué ${n} ${n===1?"torneo":"torneos"}, invertí ${cop(invertido)} y gané ${cop(s.premios)} en premios.`};
$("month").textContent="Fin de la temporada"; hud();
const extra=key==="reinvencion"&&s.finCausa?` Esta vez, ${s.finCausa}.`:(s.finCausa&&["quemado","lesionado","sinrecursos"].includes(key)?` En tu caso, ${s.finCausa}.`:"");
el.innerHTML=`<p class="ending ${["consolidado","despegue","superviviente","reinvencion"].includes(key)?"ok":""}">${F[0]}</p>
<h1 style="font-size:clamp(36px,10.5vw,58px)">${F[1]}</h1>${STAKES}
<p class="lead">${F[2]}${extra}</p>
<div class="big">
<div><span class="n">${cop(invertido)}</span><span>invertidos en tu carrera</span></div>
<div><span class="n" style="color:${s.premios?"var(--green)":"var(--fg)"}">${cop(s.premios)}</span><span>ganados en premios</span></div>
<div><span class="n">${s.cortes}/${n}</span><span>cortes pasados</span></div>
<div><span class="n">#${s.ranking}</span><span>ranking final${s.deuda?` · deuda ${cop(s.deuda)}`:""}</span></div>
</div>
<p class="note">Empezaste con el mismo talento en todas las partidas. Lo que cambió tu carrera fue cómo administraste la plata, el cuerpo y la cabeza.</p>
${quote(key==="despegue"||key==="consolidado"?"gusEquipo":"gusApoyo")}
${s.ecos.length?`<div class="tag">Lo que tus decisiones dejaron</div><ol class="log">${s.ecos.map((e,i)=>`<li><span>Eco ${i+1}</span>${e}</li>`).join("")}</ol>`:""}
<div class="tag">Tus decisiones</div>
<ol class="log num">${s.log.map((l,i)=>`<li><span>${i+1}</span><div><b>${l.tag}</b> · ${l.t}</div></li>`).join("")}</ol>
<section class="docu"><span class="tag">Fuera de Límites · el documental</span><h3>Esto les pasa de verdad</h3>
<p class="lead">Alejandro, Gustavo y Carlos cuentan lo que acabas de jugar.</p>
${CONFIG.documentalURL?`<a class="btn" href="${CONFIG.documentalURL}" target="_blank" rel="noopener">Ver el documental</a>`:""}</section>
${CONFIG.googleForm?formHTML():""}
<div class="row"><button class="btn ghost" id="share">Compartir mi resultado</button><button class="btn" id="again">Jugar otra temporada</button></div>
<details class="sources"><summary>Fuentes de los precios</summary>
<p>Federación Colombiana de Golf: Resolución 2055 Tour de Desarrollo 2026 (inscripción $455.000 nacionales, marcador $150.000, sin caddie), Reglamento 8º Abierto HG 2026 (profesionales $500.000, caddie $100.000/día, bolsa $75 millones), I Tour Championship Colombia 2026 ($555.000, 90 cupos), Abierto del Eje Cafetero 2026 (caddie $125.000/día). PGA Tour Americas 2026 (USD 200–220 por evento, bolsa USD 225.000, ganador USD 40.500) y Q-School 2026 (USD 2.250–2.750). Psicología deportiva en Bogotá $80.000–180.000 por sesión (Doctoralia, Top Doctors, AgendaPro). Clases de golf $56.000–100.000 por hora (Superprof). Las demás cifras son aproximaciones del equipo.</p></details>`;
$("again").onclick=reset; $("share").onclick=share;
if(CONFIG.googleForm) $("refl").addEventListener("submit",sendRefl);
}
async function share(){
const url=location.href.split("#")[0].split("?")[0], text=current.frase+" ¿Tú cómo terminarías?";
try{ if(navigator.share){await navigator.share({title:"El Costo del Green",text,url});return} }catch(e){return}
try{ await navigator.clipboard.writeText(text+" "+url); $("share").textContent="Copiado"; setTimeout(()=>{const b=$("share");if(b)b.textContent="Compartir mi resultado"},2000);}catch(e){}
}
/* ---------- Encuesta opcional (Google Forms) ---------- */
function formHTML(){
const pill=(n,v)=>`<input type="radio" name="${n}" id="${n}_${v.replace(/\W/g,"")}" value="${v}"><label for="${n}_${v.replace(/\W/g,"")}">${v}</label>`;
return `<form class="uni" id="refl" novalidate><h2>Ahora cuéntanos tú</h2>
<p class="lead">Tus respuestas alimentan la investigación de Fuera de Límites. Son anónimas.</p>
<fieldset><legend>Antes de jugar, ¿qué tanto sabías de lo que enfrenta un golfista profesional en Colombia?</legend><div class="pills">${["No tenía idea","Sabía muy poco","Sabía algo","Sabía bastante"].map(v=>pill("conoc",v)).join("")}</div></fieldset>
<fieldset><legend>¿Qué fue lo que más te sorprendió?</legend><div class="pills">${["Lo que cuesta competir","La presión mental","Que no haya patrocinio","Que el talento no alcance"].map(v=>pill("sorp",v)).join("")}</div></fieldset>
<div><label class="q" for="exp">¿Cómo fue tomar estas decisiones?</label><textarea id="exp" rows="3" maxlength="500"></textarea></div>
<div><label class="q" for="apr">¿Qué aprendiste que no sabías antes de jugar?</label><textarea id="apr" rows="3" maxlength="500"></textarea></div>
<button class="btn" type="submit" id="send">Enviar mi respuesta</button><p id="sendMsg" class="muted" role="status"></p></form>`;
}
async function sendRefl(e){
e.preventDefault(); const msg=$("sendMsg"), g=CONFIG.googleForm;
const conoc=(document.querySelector('input[name="conoc"]:checked')||{}).value;
if(!conoc){msg.textContent="Cuéntanos qué tanto sabías antes de jugar.";return}
const fd=new FormData(), add=(k,v)=>{if(g.campos[k])fd.append(g.campos[k],v)};
add("final",FINALES[current.key][0]); add("conocimiento",conoc);
add("sorpresa",(document.querySelector('input[name="sorp"]:checked')||{}).value||"");
add("experiencia",$("exp").value.trim().slice(0,500)); add("aprendizaje",$("apr").value.trim().slice(0,500));
$("send").disabled=true; msg.textContent="Enviando…";
try{await fetch(g.action,{method:"POST",mode:"no-cors",body:fd});$("refl").innerHTML='<h2>Gracias.</h2><p class="lead">Tu respuesta ya hace parte de la investigación de Fuera de Límites.</p>'}
catch(err){$("send").disabled=false;msg.textContent="No se pudo enviar. Revisa tu conexión e inténtalo otra vez."}
}
reset();
</script>
